name: Publish role to Ansible Galaxy

on:
  push:
    branches:
      - 'master'

permissions:
  contents: write

jobs:
  tag_publish_ansible_role:
    runs-on: ubuntu-latest
    name: Publish role to Ansible Galaxy
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: '0'

      - name: Bump version and push repo tag
        id: tagging
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # v1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_ORG_REPO_TAG }}
          DEFAULT_BUMP: patch
          WITH_V: "true"
          INITIAL_VERSION: 1.0.0

      - name: Publish role
        uses: robertdebock/galaxy-action@0a453680edc4dbdd811189cc7abc1b1ab094e457 # 1.0.3
        with:
          galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}